# badgR policy: the tiers of "A Threat Model for R / Shiny Applications".
# A finding is a call that reaches a capability: its class, `via` (direct | package), and the origins of its values.
# A tier is assigned when none of its `forbid` rules matches a finding and its `lint` rules report nothing.
# In a forbid rule, the origin `none` matches findings flowR traced no value for.
name: threat-model-tiers
version: 1
description: Gold, silver, and bronze as defined in the threat model (section Policy Tiers).

# who controls a value: origin classes of flowR input types
origins:
  # constants, defaults, temp files, random numbers, code
  author: [const, dconst, tempfile, rand, lang]
  # deployment, request, native code: silver trusts it, gold does not
  system: [system, ffi, options, scope]
  # parameters of the app's own functions
  parameter: [param]
  unknown: [unknown]
  # the user, files, the network
  outside: [user, file, net, glob, cmdline]
# unlisted input types (sound: least trusted inside the app)
fallbackOrigin: unknown

# what a call can do; first match wins, most severe first.
# tags / callProps: flowR SemanticCallTag / CallProp; functions: regexes, with `::` matched against pkg::fn
capabilities:
  code-execution:
    class: severe
    description: evaluates R code
    functions:
      - '^(eval|evalq|eval\.parent|parse|str2lang|str2expression|unserialize)$'
      # code of other languages, and code sent to the IDE
      - '^reticulate::(py_run_string|py_run_file|py_eval|source_python|repl_python)$'
      - '^Rcpp::(sourceCpp|cppFunction|evalCpp)$'
      - '^rstudioapi::(sendToConsole|executeCommand|jobRunScript)$'
      # code that runs later, elsewhere, or in place of other code
      - '^(delayedAssign|trace|assignInNamespace|assignInMyNamespace)$'
      - '^(future::)?(future|futureCall|futureAssign)$'
      - '^promises::future_promise$'
      - '^rlang::(eval_tidy|eval_bare|parse_expr|parse_exprs|exec|inject)$'
      - '^purrr::(exec|invoke|invoke_map)$'
    tags: [eval]
    unlessCallProps: [pure]
    unlessArgProps: [callee]
  code-download:
    class: severe
    description: loads and runs code or data from a path or URL, or installs packages
    functions:
      - '^(source|sys\.source|download\.file)$'
      # installing a package runs its code
      - '^(install\.packages|install_(github|gitlab|bitbucket|url|git|svn|version|bioc|cran|dev|local)|pkg_install|source_url|source_gist)$'
      # rendering a document runs the code in it, as source() does
      - '^(knitr::(knit|knit2html|knit2pdf|knit_child|spin|stitch)|rmarkdown::render|quarto::quarto_render)$'
  native:
    class: severe
    description: calls native code
    functions: ['^(\.C|\.External|\.Fortran|\.Call|dyn\.load)$']
    callProps: [ffi]
  shell:
    class: severe
    description: runs a command of the operating system
    functions:
      - '^(system|system2|shell|shell\.exec|pipe)$'
      - '^(processx|callr|sys)::'
    tags: [process]
  environment:
    class: severe
    description: changes environment variables, which decide what later commands run (PATH, LD_PRELOAD)
    functions: ['^(Sys\.setenv|Sys\.unsetenv)$']
  serialization:
    class: severe
    description: reads or writes serialized R objects
    functions: ['^(saveRDS|load|save|serialize|dump|readRDS|read\.rds)$']
  destructive:
    class: outward
    description: removes, renames, or overwrites files
    functions:
      - '^(file\.remove|file\.rename|file\.copy|file\.create|file\.append|unlink)$'
      - '^(file\.symlink|file\.link|Sys\.chmod|Sys\.umask|Sys\.setFileTime)$'
      # extracting or creating archives writes (and overwrites) files
      - '^(utils::)?(unzip|untar|zip|tar)$'
  process-control:
    class: severe
    description: opens programs or the IDE editor, runs R CMD, or signals processes
    functions: ['^(tools::)?(Rcmd|pskill)$', '^(utils::)?(browseURL|file\.edit)$']
  # a package loaded by a computed name runs whatever package that is; library(shiny) is no finding
  package-load:
    class: severe
    description: attaches or loads a package by a computed name, which runs that package's code
    functions:
      - '^(library|require|loadNamespace|requireNamespace|attachNamespace|loadPackageNamespace)$'
      - '^(pacman::p_load|box::use)$'
    unlessOrigins: [author]
  # a call of a value the analysis cannot resolve to a function: `l$f(x)`, `get(x)(y)`
  dynamic-call:
    class: severe
    description: calls a function the analysis cannot resolve
    dynamic: true
  network-file:
    class: outward
    description: opens a network or file connection, or reads or writes a file
    functions:
      - '^(url|file|socketConnection|gzfile|bzfile|xzfile|fifo|unz)$'
      - '^(readLines|writeLines|scan|sink|write|writeBin|readBin|writeChar|readChar)$'
      - '^(read\.table|read\.csv2?|read\.delim2?|read\.fwf|read\.dcf|write\.csv2?|write\.table|write\.dcf)$'
    # not `writes`: flowR states it for cat() and graphics devices too; cat() and the like write to a file they are given
    withArgument:
      file: ['^(cat|capture\.output|dput)$']
    tags: [network]
  output:
    class: other
    description: emits HTML or JavaScript, or queries a database
    tags: [html, javascript, database]

# package functions whose internal sinks do not count (Shiny evaluates the author's code)
trusted:
  # an R6 class generator: its $new() and methods are the author's code
  - '^R6::R6Class$'
  # renderers that evaluate the author's expression, as shiny's render functions do
  - '^plotly::(renderPlotly|plotlyOutput|event_data)$'
  # rlang's argument checks and conditions evaluate only the package's own calls
  - '^rlang::(abort|warn|inform|signal|arg_match0?|check_\w+|caller_(env|arg|call)|current_(env|call)|list2|dots_list|enquos?|enexprs?|ensyms?|format_error_bullets|is_\w+|local_options|on_load|run_on_load)$'
  # data.table evaluates only the expressions of the caller (`[` i/j/by) and builds tables from values
  - '^data\.table::(data\.table|as\.data\.table|setDT|setkeyv?|setorderv?|setnames|copy|rbindlist|\w+\.data\.table|:=|\[\.data\.table)$'
  # ggplot2 builds plots from the caller's own expressions (aes() are evaluated in the data); ggsave writes a file and stays looked at
  - '^ggplot2::(?!ggsave$)\w+$'
  # dplyr's column selection helpers evaluate the caller's own expressions and names (glue builds names)
  - '^dplyr::(across|if_any|if_all|c_across|pick|cur_\w+)$'
  # DT render functions are like shiny's render*: they evaluate the caller's own expression
  - '^DT::(renderDT|renderDataTable|datatable|dataTableOutput|DTOutput|dataTableProxy|replaceData|formatStyle|formatCurrency|formatRound|formatPercentage|formatDate)$'
  # testthat expectations evaluate the quoted code the author passes in (quasi_label), not strings
  - '^testthat::(expect_\w+|test_that|describe|it|context|skip\w*|succeed|fail|local_\w+|with_\w+|test_path)$'
  - '^shiny::(observe|observeEvent|reactive|eventReactive|req|isolate|render\w*|bindEvent|bindCache|validate|need|outputOptions|moduleServer|callModule|NS)$'
  # reactive values and their timing: they hold and pass on the values they are given (badgR traces those)
  - '^shiny::(reactiveVal|reactiveValues|debounce|throttle|reactivePoll|reactiveTimer|invalidateLater|freezeReactiveValue)$'

# calls that never become findings, whatever they can do: regular expressions on
# pkg::fn (or fn when flowR cannot qualify it). Use sparingly: an allowed call is not
# looked at at all, unlike `trusted`, which only skips the sinks inside a package.
# Shiny's session object: the methods Shiny gives it (a variable named session that holds
# other functions under other names stays a finding); data.table's `.()`, its alias of list()
allow:
  - '^session\$(onSessionEnded|onEnded|onFlush|onFlushed|sendCustomMessage|sendInputMessage|sendBinaryMessage|setBookmarkExclude|getBookmarkExclude|onBookmark|onBookmarked|onRestore|onRestored|doBookmark|reload|close|ns|getCurrentOutputInfo|registerDataObj|resetBrush|allowReconnect)$'
  - '^\.$'

# which files ship and run where the artifact is used, from flowR's file roles:
# source (R/, app scripts), test (tests/), vignette (vignettes/), install (inst/),
# startup (.Rprofile). Forbid rules apply to the shipped files unless they give
# `files:` (role names or `shipped`); findings elsewhere are only reported.
shipped: [source, install, startup]

# extra flowR linting rules, reported only
report:
  - call-contracts
  - unescaped-arguments
  - network-functions

# time limits, in seconds
# lintTimeout: one linting rule; a rule that takes longer is stopped and counts as
#   not run, so no tier that needs it is reached
# lintReadTimeout: a linting worker reading the code; after that, its rules count as not run
# timeout: the whole analysis (leave out for no limit); the artifact then gets the
#   fallback tier. The --timeout option of the CLI overrides it.
lintTimeout: 120
lintReadTimeout: 900

# strictest first
tiers:
  - name: gold
    summary: Nothing leaves the app, and every other risky call uses only values written in the code.
    color: '#d4aa32'
    review: deployment and access control only
    description: >-
      No dangerous call and no call that reaches files or the network, not even with fixed values.
      Every other risky call uses only values written in the code. No hardcoded or leaked secret, and
      no state that one user's session leaves for the next.
    forbid:
      - classes: [severe, outward]
        reason: a dangerous call or a call that reaches files or the network, whatever its values
      - classes: [other]
        origins: [system, parameter, unknown, outside]
        reason: a risky call with a value that is not written in the code
    lint:
      - secret-exfiltration
      - process-state-in-session
      - no-leaked-credentials
  - name: silver
    summary: No value from users, files, or the network reaches a dangerous call.
    color: '#aaacb2'
    review: the remaining findings, which are user values in other risky calls, and parameters or unknown values inside packages
    description: >-
      No value from users, files, or the network reaches a dangerous call, and the app's own
      dangerous calls get no function parameter or value of unknown source either.
    forbid:
      - classes: [severe]
        origins: [outside]
        reason: a value from users, files, or the network in a dangerous call
      - classes: [severe]
        origins: [parameter, unknown]
        via: direct
        reason: a function parameter or a value of unknown source in a dangerous call of the app itself
  - name: bronze
    summary: Values from users, files, or the network reach dangerous calls only inside packages.
    color: '#b06e3c'
    review: the remaining findings and the package calls that hand user values on to dangerous calls
    description: >-
      Values from users, files, or the network reach dangerous calls only inside package functions,
      never in a dangerous call of the app itself.
    forbid:
      - classes: [severe]
        origins: [outside]
        via: direct
        reason: a value from users, files, or the network in a dangerous call of the app itself
# no tier met, or not analyzable
fallbackTier:
  name: none
  color: '#6b6b6b'
  review: full

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flowr/sigdb
          key: sigdb-${{ hashFiles('node_modules/@eagleoutice/flowr/data/sigdb/sigdb.remote.json') }}
      - run: npm run sigdb
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t badgr .
      # works offline: the signature database is in the image
      - run: docker run --rm --network none -v "$PWD/test/fixtures/bronze:/work/src:ro" badgr --min-tier bronze /work/src

  # the image on Docker Hub, from main once the tests pass: eagleoutice/badgr:latest and :<version>
  docker-publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t badgr .
      - run: docker run --rm --network none -v "$PWD/test/fixtures/bronze:/work/src:ro" badgr --min-tier bronze /work/src
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_NAME }}
          password: ${{ secrets.DH_PASSWD }}
      - name: push
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker tag badgr "eagleoutice/badgr:$VERSION"
          docker tag badgr eagleoutice/badgr:latest
          docker push "eagleoutice/badgr:$VERSION"
          docker push eagleoutice/badgr:latest

  # the playground, built from main with the package data of all of CRAN
  pages-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flowr/sigdb
          key: sigdb-${{ hashFiles('node_modules/@eagleoutice/flowr/data/sigdb/sigdb.remote.json') }}
      - run: npm run sigdb
      - run: npm run web:build
      - run: npm run web:data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

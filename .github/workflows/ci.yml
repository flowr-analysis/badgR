name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flowr/sigdb
          key: sigdb-${{ hashFiles('node_modules/@eagleoutice/flowr/data/sigdb/sigdb.remote.json') }}
      - run: npm run sigdb
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t badger .
      # works offline: the signature database is in the image
      - run: docker run --rm --network none -v "$PWD/test/fixtures/bronze:/work/src:ro" badger --min-tier bronze /work/src

  # the image on Docker Hub once the tests pass: main is eagleoutice/badger:latest, a tag v1.2.3 is :1.2.3
  docker-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t badger .
      - run: docker run --rm --network none -v "$PWD/test/fixtures/bronze:/work/src:ro" badger --min-tier bronze /work/src
      # like flowR's release, with docker login; one secret, an access token of the Docker Hub user eagleoutice
      - name: push
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::DOCKERHUB_TOKEN is not set, so the image is not pushed to Docker Hub"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u eagleoutice --password-stdin
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=latest
          fi
          docker tag badger "eagleoutice/badger:$TAG"
          docker push "eagleoutice/badger:$TAG"
      # the page of the image on Docker Hub: docker/README.md and the --help of the image just built
      - name: describe
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            exit 0
          fi
          if ! JWT=$(jq -n --arg p "$DOCKERHUB_TOKEN" '{username: "eagleoutice", password: $p}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login | jq -er .token); then
            echo "::warning::could not log in to Docker Hub to update the description"
            exit 0
          fi
          { cat docker/README.md; printf '```text\n'; docker run --rm badger --help; printf '```\n'; } > dockerhub-readme.md
          jq -n --rawfile readme dockerhub-readme.md \
            '{description: "Checks R code against a policy of tiers (gold, silver, bronze), using flowR", full_description: $readme}' \
            | curl -fsS -o /dev/null -X PATCH -H "Authorization: JWT $JWT" -H 'Content-Type: application/json' -d @- \
              https://hub.docker.com/v2/repositories/eagleoutice/badger/ \
            || echo "::warning::could not update the description on Docker Hub (the token needs read, write, and delete access)"

  # the playground, built from main with the package data of all of CRAN
  pages-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flowr/sigdb
          key: sigdb-${{ hashFiles('node_modules/@eagleoutice/flowr/data/sigdb/sigdb.remote.json') }}
      - run: npm run sigdb
      - run: npm run web:build
      - run: npm run web:data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
